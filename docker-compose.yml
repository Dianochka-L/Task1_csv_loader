services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loader
      POSTGRES_USER: loader
      POSTGRES_PASSWORD: loader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loader -d loader"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: loader
      DB_USER: loader
      DB_PASSWORD: loader
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: